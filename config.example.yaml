# config.example.yaml —— 凭证隔离网关配置模板
#
# 用法:cp config.example.yaml config.yaml,然后改 config.yaml(已在 .gitignore,不进版本库)。
# 真凭证建议用环境变量注入(env 覆盖 YAML);也可直接写进本地 config.yaml。
# 也可以用 GATEWAY_CONFIG=/path/to/your.yaml 指向自己的配置文件。

upstream:
  base: https://api.anthropic.com

  # 真凭证:你订阅的 access token(以 Authorization: Bearer 注入)。下面两项【只能配一个】,
  # 都配则启动直接失败 —— 凭证来源必须唯一,静默择一只会让「改了却没生效」变成一次排查。
  #
  # oauth:静态 token(claude setup-token 签的那种)。没有过期信息,网关也不管它的死活。
  #   注意它的 scopes 只有 user:inference:推理正常,但设备上 /usage 和 /api/oauth/*
  #   会被上游 403。留空则用环境变量 CLAUDE_GATEWAY_UPSTREAM_OAUTH 注入。
  oauth: ""
  # credentials:交互式 /login 写出的凭证文件。scopes 含 user:profile,/usage 才有数据。
  #   网关【从不写】这个文件:自刷新也是 fork `claude auth login` 让客户端去写。
  #   它还会按 mtime 热重载,所以别人换掉凭证网关也跟得上。
  #   也可用环境变量 CLAUDE_GATEWAY_UPSTREAM_CREDENTIALS 注入。
  credentials: ""
  #
  # 两个都留空 → 回退到本机 ~/.claude/.credentials.json(启动日志会明说这次用的是哪一份)。

  # 自刷新:剩余有效期不足 30 分钟时,网关 fork 一个 `claude auth login` 把凭证续上
  # (子进程负责写回和 refresh token 的轮换持久化,网关永远不写凭证文件)。
  # 不配 = 开:凭证文件形态一律如此,含回退到 ~/.claude/.credentials.json 那条 ——
  # access token 只活 8 小时,不自刷新就是每 8 小时静默断一次。静态 token 恒关
  # (没有 refreshToken 可用)。显式 true/false 一律照办。
  # refresh: false
  # 刷新用哪个 claude;留空就是裸 "claude" 走 PATH(claude 自更新换了路径也不受影响)。
  claude_bin: ""

# 代理的主机名单(api.anthropic.com 解密注入真凭证;其余 Claude 相关主机盲转发;两者之外 403)
# 和路径黑名单(Artifact、Remote Control)都写死在 proxy.go 里,不是配置项 ——「真凭证送给谁」
# 和「哪些主机经网关」都不该是部署时随手改的东西。设备侧分流代理默认按同一份名单把 Claude
# 相关主机送来网关,名单外的主机从设备本机直连。网关启动时会把名单打出来。

# 转发-only SSH 层:唯一对外入口(始终启用)。设备身份 = SSH 公钥,单一数据源就是下面的
# authorized_keys;客户端发的占位凭证网关不校验,只覆盖。
# 公钥认证、只能转发到 permit_target、无 shell/pty、禁 -R;session 上只认一条 exec:
# `device-binary <os>/<arch>`,把设备端二进制发给已认证设备。详见 docs/transport.md。
ssh:
  addr: ":2222"                       # 唯一对外端口
  host_key: ./ssh_host_ed25519_key    # 服务端私钥(机密,已 gitignore);不存在则首启自动生成
  ca_key: ./ccgw_ca_key               # TLS 终结 CA(机密);自动生成,另导出 ccgw_ca_key.crt 给设备信任
  # 转发白名单:设备侧分流代理开 channel 时声明的目标须在其中(网关并不真监听它们)。
  # unix 那项是 ANTHROPIC_UNIX_SOCKET 形态用的。
  permit_targets:
    - 127.0.0.1:8788
    - unix:/run/ccgw.sock
  # 设备端二进制目录(<dir>/<os>/<arch>),`make device-bins` 产出;设备接入脚本经 ssh 取。
  device_bin_dir: ./dist/device
  authorized_keys:                    # 可信设备公钥,每台一项;改 config.yaml 重读即生效
    - id: laptop-1
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA-REPLACE-ME laptop-1"
