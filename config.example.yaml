# config.example.yaml —— 凭证隔离网关配置模板
#
# 用法:cp config.example.yaml config.yaml,然后改 config.yaml(已在 .gitignore,不进版本库)。
# 真凭证建议用环境变量注入(env 覆盖 YAML);也可直接写进本地 config.yaml。
# 也可以用 GATEWAY_CONFIG=/path/to/your.yaml 指向自己的配置文件。

# 监听地址(生产/公网暴露请放 TLS + 防火墙/VPN 后,host 再改 0.0.0.0)
host: 127.0.0.1
port: 8788

upstream:
  base: https://api.anthropic.com
  # 真凭证:你订阅的 access token(以 Authorization: Bearer 注入)。
  # 留空则用环境变量 CLAUDE_GATEWAY_UPSTREAM_OAUTH 注入。
  oauth: ""

# 前置鉴权:每台设备配一个【不同的】占位 token → { id }。
# 把这个占位下发给客户端当 CLAUDE_CODE_OAUTH_TOKEN,
# 网关用它识别设备(per-device 审计全靠它),再换成真凭证转发。占位不是真凭证。
# 提示:占位最好仿真凭证前缀(如 sk-ant-oat01-...),避免客户端对 token 格式做校验时报错。
# 也可用环境变量 GATEWAY_USERS(JSON)覆盖。
users:
  sk-ant-oat01-alice-REPLACE-ME:
    id: alice
  sk-ant-oat01-bob-REPLACE-ME:
    id: bob
