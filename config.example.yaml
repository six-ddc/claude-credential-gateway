# config.example.yaml —— 凭证隔离网关配置模板
#
# 用法:cp config.example.yaml config.yaml,然后改 config.yaml(已在 .gitignore,不进版本库)。
# 真凭证建议用环境变量注入(env 覆盖 YAML);也可直接写进本地 config.yaml。
# 也可以用 GATEWAY_CONFIG=/path/to/your.yaml 指向自己的配置文件。

upstream:
  base: https://api.anthropic.com
  # 真凭证:你订阅的 access token(以 Authorization: Bearer 注入)。
  # 留空则用环境变量 CLAUDE_GATEWAY_UPSTREAM_OAUTH 注入。
  oauth: ""

# 代理的主机名单(哪个域名解密注入真凭证、哪些只做盲转发)写死在代码里,不是配置项 ——
# 「真凭证送给谁」和「设备能出到哪儿」都不该是部署时随手改的东西。见 proxy.go 顶部,
# 网关启动时也会把两份名单打出来。要放行别的主机就改代码重编译。

# 转发-only SSH 层:唯一对外入口(始终启用)。设备身份 = SSH 公钥,单一数据源就是下面的
# authorized_keys;客户端发的占位凭证网关不校验,只覆盖。
# 公钥认证、只能转发到 permit_target、无 shell/exec、禁 -R。详见 docs/transport.md。
ssh:
  addr: ":2222"                       # 唯一对外端口
  host_key: ./ssh_host_ed25519_key    # 服务端私钥(机密,已 gitignore);不存在则首启自动生成
  ca_key: ./ccgw_ca_key               # TLS 终结 CA(机密);自动生成,另导出 ccgw_ca_key.crt 给设备信任
  # 转发白名单:客户端 -L 声明的目标须在其中(网关并不真监听它们)。
  # tcp 那项是代理形态用的;unix 那项留着兼容老设备的 ANTHROPIC_UNIX_SOCKET 形态。
  permit_targets:
    - 127.0.0.1:8788
    - unix:/run/ccgw.sock
  authorized_keys:                    # 可信设备公钥,每台一项;改 config.yaml 重读即生效
    - id: laptop-1
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA-REPLACE-ME laptop-1"
